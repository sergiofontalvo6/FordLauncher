name: 💡 Sugerir una mejora
description: Una idea para FordLauncher
labels: [mejora]
body:
  - type: textarea
    id: idea
    attributes:
      label: ¿Qué te gustaría?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: ¿Para qué te serviría?
  - type: input
    id: android
    attributes:
      label: Android de tu pantalla (opcional)
      placeholder: "6.0.1 (API 17)"
