name: Publicar versión

# Se ejecuta cuando cambia versionName en app/build.gradle (rama main) o al subir una etiqueta vX.Y.Z.
# Si esa versión aún no tiene Release: compila el APK firmado, crea la etiqueta y el Release con las
# notas de changelogs/X.Y.Z.md y actualiza update.json (lo que FordLauncher consulta para avisar).
on:
  push:
    branches: [ main ]
    paths: [ 'app/build.gradle', '.github/workflows/release.yml' ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ¿Hay versión nueva por publicar?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VN=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "VERSION=$VN" >> "$GITHUB_ENV"
          echo "TAG=v$VN" >> "$GITHUB_ENV"
          if gh release view "v$VN" >/dev/null 2>&1; then
            echo "La versión v$VN ya está publicada; no hay nada que hacer."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.skip != 'true'

      - name: Preparar la clave de firma
        if: steps.check.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64 (Settings → Secrets and variables → Actions)."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "FORDLAUNCHER_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Comprobar que la versión coincide con la etiqueta
        if: steps.check.outputs.skip != 'true'
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$TAG" ]; then
            echo "::error::versionName ($VERSION) no coincide con la etiqueta (${GITHUB_REF_NAME})"; exit 1
          fi

      - name: Compilar APK firmado
        if: steps.check.outputs.skip != 'true'
        env:
          FORDLAUNCHER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FORDLAUNCHER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FORDLAUNCHER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Notas de la versión
        if: steps.check.outputs.skip != 'true'
        run: |
          F="changelogs/$VERSION.md"
          if [ -f "$F" ]; then cp "$F" "$RUNNER_TEMP/notes.md"; else echo "Mejoras y correcciones." > "$RUNNER_TEMP/notes.md"; fi
          {
            echo ""
            echo "---"
            echo "**Cómo instalar:** descarga \`FordLauncher-$VERSION.apk\`, cópialo a una memoria USB, pásalo a la memoria interna de la pantalla e instálalo. Guía completa: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY#-instalación"
          } >> "$RUNNER_TEMP/notes.md"

      - name: Crear el Release
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: FordLauncher ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/notes.md
          files: app/build/outputs/apk/release/FordLauncher-*.apk

      - name: Actualizar update.json (aviso dentro de la app)
        if: steps.check.outputs.skip != 'true'
        run: |
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          jq -n --arg v "$VERSION" --rawfile n "changelogs/$VERSION.md" \
                --arg url "$REPO_URL/releases/tag/$TAG" \
                --arg apk "$REPO_URL/releases/download/$TAG/FordLauncher-$VERSION.apk" \
                --arg donate "$(jq -r '.donate_url // empty' update.json 2>/dev/null)" \
                '{version:$v, notes:$n, url:$url, apk:$apk} + (if $donate != "" then {donate_url:$donate} else {} end)' > "$RUNNER_TEMP/update.json" \
            || jq -n --arg v "$VERSION" --arg url "$REPO_URL/releases/tag/$TAG" --arg apk "$REPO_URL/releases/download/$TAG/FordLauncher-$VERSION.apk" \
                '{version:$v, notes:"", url:$url, apk:$apk}' > "$RUNNER_TEMP/update.json"
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/update.json" update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet || git commit -m "update.json → $VERSION"
          git push origin main

      - name: Refrescar la copia de jsDelivr (las pantallas con Android 4.x la usan)
        if: steps.check.outputs.skip != 'true'
        run: |
          for i in 1 2 3; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/update.json" && break || sleep 20
          done
          sleep 15
          curl -fsS "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/update.json" | jq -r .version || true
